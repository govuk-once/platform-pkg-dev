networks:
  sam-local:
    name: sam-local
    driver: bridge

services:
  localstack:
    image: localstack/localstack:3.8
    container_name: sam-localstack
    networks: [sam-local]
    ports:
      - 4566:4566
    environment:
      SERVICES: dynamodb,sqs,s3,kms
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4566/_localstack/health | grep -q running']
      interval: 5s
      timeout: 3s
      retries: 10

  dsql-emulator:
    image: ghcr.io/dreamescaper/dsql-emulator:latest
    container_name: sam-dsql-emulator
    networks: [sam-local]
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 5432']
      interval: 5s
      timeout: 3s
      retries: 10
