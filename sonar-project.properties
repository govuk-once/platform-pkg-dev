sonar.organization=govuk-once
sonar.projectKey=govuk-once_platform-pkg-dev

sonar.typescript.tsconfigPaths=tsconfig.src.json,tsconfig.sam.json

sonar.exclusions=**/dist/**,**/coverage/**,**/node_modules/**,**/*.test.ts,**/*.spec.ts,scripts/sonarToJira.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
